<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Games</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { color: #1a1a1a; margin-bottom: 30px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            aspect-ratio: 1;
            justify-content: center;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 12px rgba(0,0,0,0.15); }
        .icon { font-size: 3rem; margin-bottom: 10px; }
        .title { font-weight: bold; font-size: 1.1rem; }
        .card.disabled { opacity: 0.6; cursor: not-allowed; filter: grayscale(1); }
    </style>
</head>
<body>

    <h1>🧠 Brain Games</h1>

    <div class="grid">
        <a href="./sudoku/" class="card">
            <div class="icon">🔢</div>
            <div class="title">Sudoku Pro</div>
        </a>

        <div class="card disabled">
            <div class="icon">🃏</div>
            <div class="title">Memory<br><small>(Coming Soon)</small></div>
        </div>

        <div class="card disabled">
            <div class="icon">✖️</div>
            <div class="title">Mathe<br><small>(Coming Soon)</small></div>
        </div>
        
        <div class="card disabled">
            <div class="icon">🔤</div>
            <div class="title">Wordle<br><small>(Coming Soon)</small></div>
        </div>
    </div>

</body>
</html>
