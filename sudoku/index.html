<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Sudoku Master</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<header>
    <div class="header-left">
        <h1>Sudoku</h1>
        <div id="game-timer" class="timer">00:00</div>
    </div>
    <div class="header-right">
        <button id="btn-sound" title="Sound">🔊</button>
        <button id="btn-theme" title="Theme">🌙</button>
        <button id="btn-highscore" title="Highscore">🏆</button>
    </div>
</header>

<div class="settings-bar">
    <select id="mode-select">
        <option value="classic">Klassisch (9x9)</option>
        <option value="mini">Mini (6x6)</option>
        <option value="diagonal">Diagonal</option>
        <option value="killer">Killer</option>
    </select>
    <select id="diff-select">
        <option value="easy">Einfach</option>
        <option value="medium" selected>Mittel</option>
        <option value="hard">Schwer</option>
    </select>
    <button id="btn-new-game" class="btn-primary">Neu</button>
</div>

<div id="game-container">
    <div id="sudoku-board">
        </div>
</div>

<div class="controls-area">
    <div class="action-buttons">
        <button id="btn-undo">↩️</button>
        <button id="btn-redo">↪️</button>
        <button id="btn-delete">⌫</button>
        <button id="btn-hint">💡</button>
        <button id="btn-solve" style="color: #d63384;">🏳️</button>
    </div>
    
    <div class="numpad-container">
        <div class="numpad" id="numpad-1-5">
            <button class="btn-num" data-val="1">1</button>
            <button class="btn-num" data-val="2">2</button>
            <button class="btn-num" data-val="3">3</button>
            <button class="btn-num" data-val="4">4</button>
            <button class="btn-num" data-val="5">5</button>
        </div>
        <div class="numpad row2" id="numpad-6-9">
            <button class="btn-num" data-val="6">6</button>
            <button class="btn-num" data-val="7">7</button>
            <button class="btn-num" data-val="8">8</button>
            <button class="btn-num" data-val="9">9</button>
        </div>
    </div>
</div>

<div id="modal-highscore" class="modal">
    <div class="modal-content">
        <h2>Top 5 Highscores</h2>
        <ul id="highscore-list" class="highscore-list"></ul>
        <button id="btn-close-modal" style="width:100%; margin-top:15px; padding:10px;">Schließen</button>
    </div>
</div>

<div id="modal-win" class="modal">
    <div class="modal-content">
        <div style="font-size: 3rem; margin-bottom: 10px;">🎉</div>
        <h2>Gewonnen!</h2>
        <div class="win-stats" style="background: var(--highlight-related); padding: 10px; border-radius: 8px; margin: 15px 0;">
            <p style="margin: 5px 0;">Zeit: <strong id="win-time-display">--:--</strong></p>
            <p style="margin: 5px 0;">Punkte: <strong id="win-score-display">0</strong></p>
        </div>
        <button id="btn-next-game" class="btn-primary" style="width: 100%; padding: 15px;">Nächstes Spiel 🚀</button>
    </div>
</div>

<script src="sudoku.js?v=2"></script>

</body>
</html>
