<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anagramm - Brain Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <a href="../" class="back-btn">←</a>
            <h1>Anagramm</h1>
        </div>
        <div class="stats">
            <div id="timer-display" class="stat-item hidden">
                <span class="icon">⏱️</span>
                <span id="timer">--</span>s
            </div>
            <div class="stat-item">
                <span class="icon">🏆</span>
                <span id="score">0</span>
            </div>
        </div>
    </header>

    <main id="game-container">
        <!-- Level Selection Overlay -->
        <div id="level-selection" class="overlay">
            <div class="overlay-content">
                <h2>Wähle eine Schwierigkeit</h2>
                <div class="level-buttons">
                    <button data-level="easy" class="btn btn-easy">Einfach (Kein Zeitlimit)</button>
                    <button data-level="medium" class="btn btn-medium">Mittel (20s)</button>
                    <button data-level="hard" class="btn btn-hard">Schwer (15s)</button>
                </div>
            </div>
        </div>

        <!-- Game Area -->
        <div id="play-area" class="hidden">
            <div id="scrambled-word" class="scrambled-word"></div>
            <div id="correct-answer-display" class="correct-answer-display"></div>
            
            <div class="input-container">
                <input type="text" id="user-input" autocomplete="off" placeholder="Lösung eingeben..." autofocus>
                <button id="submit-btn" class="btn btn-primary">Prüfen</button>
            </div>

            <div class="controls">
                <button id="hint-btn" class="btn btn-secondary">Tipp</button>
                <button id="skip-btn" class="btn btn-secondary">Überspringen</button>
            </div>
        </div>

        <!-- Result Overlay -->
        <div id="result-overlay" class="overlay hidden">
            <div class="overlay-content">
                <h2 id="result-title">Zeit abgelaufen!</h2>
                <p id="result-text"></p>
                <button id="restart-btn" class="btn btn-primary">Nochmal spielen</button>
                <button id="main-menu-btn" class="btn btn-secondary">Menü</button>
            </div>
        </div>
    </main>

    <script src="anagramm.js"></script>
</body>
</html>
